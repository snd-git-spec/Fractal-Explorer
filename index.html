        <h1>Fractal Explorer — real-time 3D fractals</h1>
        <p>Fractal Explorer renders infinite 3D fractals live in your browser using WebGL ray marching. Fly the camera through them, morph their shapes, switch between modes, record video, and share exact views with a link. It needs JavaScript and WebGL to run.</p>
        <h2>Fractals included</h2>
        <ul>
          <li><strong>Mandelbulb</strong> — spherical power-N extension of the Mandelbrot set (z → zⁿ + c).</li>
          <li><strong>Mandelbox</strong> — box-fold and sphere-fold sponge of nested boxes.</li>
          <li><strong>Apollonian gasket</strong> — packing of inversive spheres.</li>
          <li><strong>Menger sponge</strong> — self-similar cube with crosses removed at every scale.</li>
          <li><strong>Sierpinski tetrahedron</strong> — tetrahedral iterated function system.</li>
          <li><strong>Quaternion Julia</strong> — 3D slice of a 4D Julia set (q → q² + c).</li>
          <li><strong>Pseudo Kleinian</strong> — Julia-box lattice with plane traps.</li>
          <li><strong>Kleinian</strong> and <strong>Kleinian IFS</strong> — fold sponges and Möbius limit-set lattices.</li>
          <li><strong>KIFS</strong> — kaleidoscopic iterated function system of infinite nested halls.</li>
          <li><strong>Kali set</strong> — inversion Julia caverns (p → |p|/|p|² − C).</li>
          <li><strong>Amazing Surf</strong> — layered 2D-fold surfaces.</li>
          <li><strong>Mandelbroth</strong> — hybrid alternating Mandelbulb and Mandelbox steps.</li>
          <li><strong>Nova / Newton</strong> — three-petal Newton convergence basins.</li>
          <li><strong>Dodecahedron IFS</strong> — five-fold recursive lace.</li>
          <li><strong>Jerusalem cube</strong> — infinite Greek-cross temple.</li>
          <li><strong>Hyperbolic kaleidoscope</strong> — ideal polyhedron cusps.</li>
          <li><strong>φ-Cavern</strong> — golden-ratio Kali caverns with five-fold symmetry.</li>
          <li><strong>Tidefold</strong> — Amazing Surf caverns flowing into a Menger sponge.</li>
        </ul>
      </main>
